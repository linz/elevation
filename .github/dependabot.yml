version: 3

updates:
  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Pacific/Auckland
    cooldown:
      default-days: 15
    commit-message:
      prefix: build(deps)
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  # JavaScript / TypeScript dependencies (package.json and its lock file)
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Pacific/Auckland
    cooldown:
      default-days: 15
    commit-message:
      prefix: build(deps)
    groups:
      # Optional: group packages that must be upgraded together, such as a
      # framework and its plugins, including major updates. Dependabot puts each
      # dependency in the first group it matches, so keep this group above the
      # catch-all. Quote scoped names, e.g. "@aws-sdk/*".
      # synchronised-packages:
      #   applies-to: version-updates
      #   patterns: [package-a, package-b]

      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
